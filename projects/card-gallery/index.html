<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Gallery</title>

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        crossorigin="anonymous"
    >

    <link
        rel="preload"
        href="../../assets/theme.css"
        as="style"
        onload="this.onload=null;this.rel='stylesheet'"
    >
    <noscript><link rel="stylesheet" href="../../assets/theme.css"></noscript>

    <link
        rel="preload"
        href="./style.css"
        as="style"
        onload="this.onload=null;this.rel='stylesheet'"
    >
    <noscript><link rel="stylesheet" href="./style.css"></noscript>
</head>
<body>

    <div class="cg-layout">

        <!-- ── Sidebar ───────────────────────────────────────── -->
        <nav class="cg-sidebar" id="cg-sidebar">
            <!-- Collapse toggle -->
            <div class="cg-sidebar-collapse">
                <button class="cg-collapse-btn" id="cg-collapse-btn" aria-label="Collapse sidebar">‹</button>
            </div>
            <!-- Album buttons populated by main.js -->
            <!-- Spacer -->
            <div class="cg-sidebar-spacer"></div>
            <!-- Scroll toggle at bottom -->
            <button class="cg-scroll-toggle" id="cg-scroll-toggle" aria-label="Toggle scrolling">
                <span class="cg-scroll-toggle-icon">⏸</span>
                <span class="cg-scroll-toggle-label">pause</span>
            </button>
        </nav>

        <!-- ── Main ──────────────────────────────────────────── -->
        <div class="cg-main">
            <div class="cg-tagbar" id="cg-tagbar"></div>
            <div class="cg-stage" id="cg-stage"></div>
        </div>

    </div>

    <!-- ── Lightbox ──────────────────────────────────────────── -->
    <div class="cg-lightbox" id="cg-lightbox" role="dialog" aria-modal="true">
        <button class="cg-lightbox-close" id="cg-lightbox-close" aria-label="Close">✕</button>
        <div class="cg-lightbox-inner">
            <div class="cg-lightbox-img-wrap">
                <img class="cg-lightbox-img" src="" alt="">
            </div>
            <div class="cg-lightbox-info">
                <span class="cg-lightbox-category"></span>
                <h2 class="cg-lightbox-title"></h2>
                <p class="cg-lightbox-desc"></p>
                <a class="cg-lightbox-download" href="" download>↓ download</a>
            </div>
        </div>
    </div>

    <script src="../../assets/site.js" defer></script>
    <script src="./main.js" defer></script>

</body>
</html>
