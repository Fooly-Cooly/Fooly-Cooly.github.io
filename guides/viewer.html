<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guide — Fooly-Cooly</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/theme.css">
  <style>
    /* Loading & error states */
    .fc-viewer-state {
      padding: 48px 0;
      font-family: var(--fc-font-mono);
      font-size: 0.85rem;
      color: var(--fc-text-muted);
    }

    .fc-viewer-state--error {
      color: #f87171;
    }

    .fc-viewer-spinner {
      display: inline-block;
      width: 10px;
      height: 1em;
      background: var(--fc-green);
      vertical-align: text-bottom;
      animation: fc-blink 0.7s step-end infinite;
      margin-left: 4px;
    }

    /* Progress bar */
    .fc-progress {
      position: fixed;
      top: 0;
      left: 0;
      height: 2px;
      width: 0%;
      background: var(--fc-green-dim);
      transition: width 0.3s ease;
      z-index: 100;
    }

    .fc-progress.done {
      width: 100%;
      opacity: 0;
      transition: width 0.2s ease, opacity 0.4s ease 0.2s;
    }

    /* Table of contents */
    .fc-toc {
      position: sticky;
      top: 32px;
      font-family: var(--fc-font-mono);
      font-size: 0.75rem;
      line-height: 1.8;
      padding-left: 20px;
      border-left: 1px solid var(--fc-green-border);
      max-height: calc(100vh - 80px);
      overflow-y: auto;
    }

    .fc-toc-label {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--fc-text-faint);
      margin-bottom: 10px;
    }

    .fc-toc a {
      display: block;
      color: var(--fc-text-muted);
      text-decoration: none;
      transition: color var(--fc-transition);
      padding: 1px 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .fc-toc a:hover,
    .fc-toc a.active {
      color: var(--fc-green);
    }

    .fc-toc a.fc-toc-h3 {
      padding-left: 12px;
      font-size: 0.72rem;
      opacity: 0.8;
    }

    /* Hide TOC on small screens */
    @media (max-width: 900px) {
      .fc-toc-col { display: none; }
    }


    /* Copy button on code blocks */
    .fc-code-wrap {
      position: relative;
    }

    .fc-copy-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: var(--fc-surface-3);
      border: 1px solid var(--fc-green-border);
      border-radius: var(--fc-radius-sm);
      color: var(--fc-text-muted);
      font-family: var(--fc-font-mono);
      font-size: 0.68rem;
      letter-spacing: 0.06em;
      padding: 3px 8px;
      cursor: pointer;
      transition: color var(--fc-transition), border-color var(--fc-transition);
    }

    .fc-copy-btn:hover {
      color: var(--fc-green);
      border-color: var(--fc-green-dim);
    }
  </style>
</head>
<body>

  <!-- Top progress bar -->
  <div class="fc-progress" id="progress"></div>

  <div class="fc-container">

    <!-- Back nav -->
    <a href="index.html" class="fc-nav-back">Back to guides</a>

    <!-- Page header — populated by JS -->
    <header style="padding: 28px 0 24px;">
      <div class="fc-page-title" id="doc-title">Loading<span class="fc-viewer-spinner"></span></div>
      <div class="fc-page-subtitle" id="doc-category"></div>
      <hr class="fc-rule" style="margin-top: 20px;">
    </header>

    <!-- Two-column layout: prose + TOC -->
    <div style="display: flex; gap: 48px; align-items: stretch; padding-bottom: 64px;">

      <!-- Main content -->
      <main style="flex: 1; min-width: 0; align-self: flex-start;">
        <div class="fc-prose" id="doc-content">
          <div class="fc-viewer-state">
            // fetching document<span class="fc-viewer-spinner"></span>
          </div>
        </div>
      </main>

      <!-- Table of contents -->
      <aside class="fc-toc-col" style="width: 200px; flex-shrink: 0;">
        <nav class="fc-toc" id="toc" aria-label="Table of contents" tabindex="-1">
          <div class="fc-toc-label">Contents</div>
          <div id="toc-links"></div>
        </nav>
      </aside>

    </div>

  </div><!-- /.fc-container -->

  <!-- Footer -->
  <div class="fc-container">
    <footer class="fc-footer">
      fooly-cooly.github.io<span class="fc-cursor"></span>
    </footer>
  </div>

  <!-- Back to top -->
  <button class="fc-back-top" id="back-top" aria-label="Back to top">^ top</button>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- marked.js for markdown parsing -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script src="../assets/site.js"></script>
  <script>
    /* ── Sanitise the ?doc= param ── */
    /* Only allow alphanumeric, hyphens, underscores — no path traversal */
    function getDocParam() {
      const raw = new URLSearchParams(window.location.search).get('doc') || '';
      return raw.replace(/[^a-zA-Z0-9_-]/g, '');
    }

    /* ── Progress bar helpers ── */
    const bar = document.getElementById('progress');
    function setProgress(pct) {
      bar.style.width = pct + '%';
    }
    function finishProgress() {
      bar.classList.add('done');
    }

    /* ── Build table of contents from parsed headings ── */
    function buildTOC(headings) {
      const container = document.getElementById('toc-links');
      if (!headings.length) {
        document.getElementById('toc').style.display = 'none';
        return;
      }
      container.innerHTML = headings.map(h => {
        const cls = h.level === 3 ? ' fc-toc-h3' : '';
        return `<a href="#${h.id}" class="${cls.trim()}">${h.text}</a>`;
      }).join('');
    }

    /* ── Highlight active TOC entry on scroll ── */
    function initScrollSpy(headings) {
      if (!headings.length) return;
      const links = document.querySelectorAll('.fc-toc a');
      const els = headings.map(h => document.getElementById(h.id)).filter(Boolean);

      const observer = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            links.forEach(l => l.classList.remove('active'));
            const active = document.querySelector(`.fc-toc a[href="#${entry.target.id}"]`);
            if (active) active.classList.add('active');
          }
        });
      }, { rootMargin: '0px 0px -70% 0px' });

      els.forEach(el => observer.observe(el));
    }

    /* ── Inject code block wrappers into the HTML string (pre-DOM) ── */
    /* Structure is emitted into the string before innerHTML so the browser
       parses the full final structure in one pass with no post-hoc reflows. */
    function wrapCodeBlocks(html) {
      return html.replace(
        /(<pre>)/g,
        '<div class="fc-code-wrap">$1'
      ).replace(
        /(<\/pre>)/g,
        '$1<button class="fc-copy-btn" aria-label="Copy code">copy</button></div>'
      );
    }

    /* ── Attach copy button listeners (structure already in DOM) ── */
    function addCopyButtons() {
      document.querySelectorAll('.fc-copy-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const pre  = btn.previousElementSibling;
          const code = pre.querySelector('code');
          const text = code ? code.innerText : pre.innerText;
          navigator.clipboard.writeText(text).then(() => {
            btn.textContent = 'copied';
            setTimeout(() => { btn.textContent = 'copy'; }, 1800);
          });
        });
      });
    }

    /* ── Main loader ── */
    async function loadDoc() {
      const doc = getDocParam();

      if (!doc) {
        showError('No document specified.', 'Try a link like <code>viewer.html?doc=your-guide</code>');
        return;
      }

      setProgress(20);

      try {
        const res = await fetch(`docs/${doc}.md`);
        setProgress(60);

        if (!res.ok) {
          if (res.status === 404) {
            showError(`Document not found: <code>${doc}.md</code>`, 'Check that the file exists in <code>guides/docs/</code>');
          } else {
            showError(`Failed to load document (HTTP ${res.status})`);
          }
          finishProgress();
          return;
        }

        const raw = await res.text();
        setProgress(80);

        /* Parse markdown
           Strategy: use walkTokens only — mutate each heading token into a
           raw 'html' token so we never touch the renderer API (which changed
           significantly in v12). This is the most version-stable approach. */
        const headings = [];

        function slugify(str) {
          /* Strip inline markdown syntax to get plain text for the slug */
          return str
            .replace(/\*\*(.+?)\*\*/g, '$1')
            .replace(/\*(.+?)\*/g, '$1')
            .replace(/`(.+?)`/g, '$1')
            .replace(/\[(.+?)\]\(.+?\)/g, '$1')
            .replace(/<[^>]+>/g, '')
            .toLowerCase()
            .replace(/[^\w\s-]/g, '')
            .replace(/\s+/g, '-')
            .replace(/-+/g, '-')
            .trim();
        }

        /* Create a fresh Marked instance via marked.use so hooks don't stack */
        const markedInstance = new marked.Marked();

        markedInstance.use({
          walkTokens(token) {
            if (token.type !== 'heading') return;

            const raw   = token.text;   /* raw inline markdown source */
            const depth = token.depth;
            const id    = slugify(raw);

            /* Collect h2 and h3 for the TOC — store readable plain text */
            const plainText = raw
              .replace(/\*\*(.+?)\*\*/g, '$1')
              .replace(/\*(.+?)\*/g, '$1')
              .replace(/`(.+?)`/g, '$1')
              .replace(/\[(.+?)\]\(.+?\)/g, '$1')
              .replace(/<[^>]+>/g, '');

            if (depth === 2 || depth === 3) {
              headings.push({ id, text: plainText, level: depth });
            }

            /* Render inline markdown inside the heading text manually
               (handles bold, italic, code, links) then emit as html token */
            const innerHtml = raw
              .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
              .replace(/\*(.+?)\*/g,     '<em>$1</em>')
              .replace(/`(.+?)`/g,       '<code>$1</code>')
              .replace(/\[(.+?)\]\((.+?)\)/g, '<a href="$2">$1</a>');

            /* Mutate the token into a raw html block — bypasses the renderer */
            token.type = 'html';
            token.text = `<h${depth} id="${id}">${innerHtml}</h${depth}>\n`;
            token.raw  = token.text;
            /* Clear child tokens so marked doesn't try to re-render them */
            token.tokens = [];
          }
        });

        const html = markedInstance.parse(raw);

        /* Inject content */
        const content = document.getElementById('doc-content');
        content.innerHTML = wrapCodeBlocks(html);

        /* Extract title from first H1 */
        const h1 = content.querySelector('h1');
        if (h1) {
          document.getElementById('doc-title').textContent = h1.textContent;
          document.title = h1.textContent + ' — Fooly-Cooly';
          /* Move h1 out of prose into the header slot, hide the in-prose one */
          h1.style.display = 'none';
        } else {
          document.getElementById('doc-title').textContent = doc;
          document.title = doc + ' — Fooly-Cooly';
        }

        /* Set category label from ?category= param if present */
        const cat = new URLSearchParams(window.location.search).get('category');
        if (cat) {
          document.getElementById('doc-category').textContent = cat;
        }

        buildTOC(headings);
        addCopyButtons();
        initScrollSpy(headings);
        finishProgress();

      } catch (err) {
        showError('Could not load document.', err.message);
        finishProgress();
      }
    }

    function showError(msg, detail = '') {
      document.getElementById('doc-title').textContent = 'Error';
      document.getElementById('doc-content').innerHTML = `
        <div class="fc-viewer-state fc-viewer-state--error">
          // ${msg}
          ${detail ? `<br><span style="color: var(--fc-text-muted); font-size:0.8em">${detail}</span>` : ''}
          <br><br>
          <a href="index.html" style="color: var(--fc-green-dim);">← back to guides</a>
        </div>`;
    }

    loadDoc();
  </script>
</body>
</html>
