<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Guides and reference documents — Fooly-Cooly">
  <title>Guides — Fooly-Cooly</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/theme.css">
  <style>
    .fc-filter-btn.fc-filter-active {
      background: var(--fc-green-glow);
      border-color: var(--fc-green);
      color: var(--fc-green);
    }
  </style>
</head>
<body>

  <div class="fc-container">

    <a href="../index.html" class="fc-nav-back">Back to home</a>

    <header style="padding: 28px 0 24px;">
      <div class="fc-page-title">Guides &amp; Reference</div>
      <div class="fc-page-subtitle" id="guides-subtitle">Loading<span class="fc-cursor"></span></div>
      <hr class="fc-rule" style="margin-top: 20px;">
    </header>

    <div id="guides-filters" style="display:none; margin-bottom: 20px;"></div>

    <div id="guides-loading" style="padding: 32px 0; font-family: var(--fc-font-mono); font-size: 0.82rem; color: var(--fc-text-muted);">
      // fetching guides<span class="fc-cursor"></span>
    </div>

    <div class="fc-card-grid" id="guides-grid" style="padding-bottom: 64px;"></div>

    <div id="guides-empty" style="display:none; padding: 32px 0; font-family: var(--fc-font-mono); font-size: 0.82rem; color: var(--fc-text-muted);">
      // no guides yet — add a .md file and run the guide helper
    </div>

  </div>

  <div class="fc-container">
    <footer class="fc-footer">
      fooly-cooly.github.io<span class="fc-cursor"></span>
    </footer>
  </div>

  <button class="fc-back-top" id="back-top" aria-label="Back to top">^ top</button>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/site.js"></script>
  <script>
    let allGuides  = [];
    let activeFilter = 'all';

    function updateSubtitle() {
      const subtitle = document.getElementById('guides-subtitle');
      const visible  = activeFilter === 'all'
        ? allGuides.length
        : allGuides.filter(g => (g.category || '') === activeFilter).length;

      if (activeFilter === 'all') {
        subtitle.textContent = `${allGuides.length} guide${allGuides.length !== 1 ? 's' : ''}`;
      } else {
        subtitle.textContent = `${visible} / ${allGuides.length} guide${allGuides.length !== 1 ? 's' : ''}`;
      }
    }

    function buildCard(g) {
      const cat  = g.category    || '';
      const url  = `viewer.html?doc=${encodeURIComponent(g.file)}${cat ? '&category=' + encodeURIComponent(cat) : ''}`;
      const desc = g.description || '';
      return `
        <a href="${url}" class="fc-card">
          ${cat  ? `<div class="fc-card-tag">${cat}</div>` : ''}
          <div class="fc-card-title">${g.title || g.file}</div>
          ${desc ? `<div class="fc-card-sub">${desc}</div>` : ''}
        </a>`;
    }

    function renderGrid() {
      const grid  = document.getElementById('guides-grid');
      const empty = document.getElementById('guides-empty');

      const filtered = activeFilter === 'all'
        ? allGuides
        : allGuides.filter(g => (g.category || '') === activeFilter);

      if (!filtered.length) {
        grid.innerHTML    = '';
        empty.style.display = 'block';
      } else {
        empty.style.display = 'none';
        grid.innerHTML = filtered.map(buildCard).join('');
      }

      updateSubtitle();
    }

    function buildFilters() {
      const bar = document.getElementById('guides-filters');

      /* Collect unique categories in the order they first appear */
      const seen = new Set();
      const cats = [];
      allGuides.forEach(g => {
        const c = g.category || '';
        if (c && !seen.has(c)) { seen.add(c); cats.push(c); }
      });

      /* No filter bar needed if everything is one category or uncategorised */
      if (cats.length < 2) return;

      bar.style.display = 'flex';
      bar.style.flexWrap = 'wrap';
      bar.style.gap = '8px';

      const allBtn = ['all', ...cats].map(cat => {
        const active = cat === 'all' ? ' fc-filter-active' : '';
        const label  = cat === 'all' ? 'All' : cat;
        return `<button class="btn-fc fc-filter-btn${active}" data-cat="${cat}">${label}</button>`;
      }).join('');

      bar.innerHTML = allBtn;

      bar.addEventListener('click', e => {
        const btn = e.target.closest('.fc-filter-btn');
        if (!btn) return;
        activeFilter = btn.dataset.cat;
        bar.querySelectorAll('.fc-filter-btn').forEach(b =>
          b.classList.toggle('fc-filter-active', b.dataset.cat === activeFilter)
        );
        renderGrid();
      });
    }

    async function loadGuides() {
      try {
        const res = await fetch('guides.json');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        allGuides = await res.json();
      } catch (err) {
        document.getElementById('guides-loading').textContent =
          `// failed to load guides manifest: ${err.message}`;
        return;
      }

      document.getElementById('guides-loading').style.display = 'none';

      if (!allGuides.length) {
        document.getElementById('guides-subtitle').textContent = '0 guides';
        document.getElementById('guides-empty').style.display  = 'block';
        return;
      }

      buildFilters();
      renderGrid();
    }

    loadGuides();
  </script>
</body>
</html>
