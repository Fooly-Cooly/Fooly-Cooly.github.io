<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confetti Demo — Fooly-Cooly</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/theme.css">
  <style>
    .demo-stage {
      min-height: 340px;
      border: 1px solid var(--fc-green-border);
      border-radius: var(--fc-radius-md);
      background: var(--fc-surface-2);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 28px 0;
      position: relative;
      overflow: hidden;
    }

    .demo-stage-label {
      font-family: var(--fc-font-mono);
      font-size: 0.75rem;
      color: var(--fc-text-faint);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      position: absolute;
      top: 14px;
      left: 16px;
    }

    /* Controls */
    .demo-controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    .demo-controls .btn-fc {
      min-width: 100px;
      text-align: center;
    }

    /* State indicator */
    .demo-status {
      font-family: var(--fc-font-mono);
      font-size: 0.8rem;
      color: var(--fc-text-muted);
    }

    .demo-status span {
      color: var(--fc-green-dim);
    }

    /* Config sliders */
    .demo-config {
      background: var(--fc-surface-2);
      border: 1px solid var(--fc-green-border);
      border-radius: var(--fc-radius-md);
      padding: 20px 24px;
      margin-bottom: 48px;
    }

    .demo-config-title {
      font-family: var(--fc-font-mono);
      font-size: 0.72rem;
      color: var(--fc-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 16px;
    }

    .demo-slider-row {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 12px;
    }

    .demo-slider-row:last-child {
      margin-bottom: 0;
    }

    .demo-slider-label {
      font-family: var(--fc-font-mono);
      font-size: 0.78rem;
      color: var(--fc-text-muted);
      min-width: 100px;
    }

    .demo-slider-row input[type="range"] {
      flex: 1;
    }

    .demo-slider-val {
      font-family: var(--fc-font-mono);
      font-size: 0.78rem;
      color: var(--fc-green-dim);
      min-width: 36px;
      text-align: right;
    }

    /* Source info */
    .demo-source {
      font-family: var(--fc-font-mono);
      font-size: 0.75rem;
      color: var(--fc-text-faint);
      padding-bottom: 32px;
    }

    .demo-source a {
      color: var(--fc-text-muted);
    }

    .demo-source a:hover {
      color: var(--fc-green-dim);
    }
  </style>
</head>
<body>

  <div class="fc-container">

    <a href="../../experiments/index.html" class="fc-nav-back">Back to experiments</a>

    <header style="padding: 28px 0 24px;">
      <div class="fc-page-title">Confetti Demo</div>
      <div class="fc-page-subtitle">Canvas · Particle rendering</div>
      <hr class="fc-rule" style="margin-top: 20px;">
    </header>

    <!-- Stage -->
    <div class="demo-stage" id="stage">
      <span class="demo-stage-label">// canvas overlay active when running</span>
      <div class="demo-status" id="status">
        status: <span id="status-val">stopped</span>
      </div>
      <button class="btn-fc" onclick="handleToggle()">Start confetti</button>
    </div>

    <!-- Controls + Config -->
    <div class="demo-config">
      <div class="demo-config-title">// controls</div>
      <div class="demo-controls" style="margin-bottom: 20px;">
        <button class="btn-fc" onclick="handleStart()">Start</button>
        <button class="btn-fc" onclick="handleStop()">Stop</button>
        <button class="btn-fc" onclick="handleRemove()">Clear</button>
        <button class="btn-fc" onclick="handleToggle()">Toggle</button>
      </div>
      <div class="demo-config-title">// configuration</div>

      <div class="demo-slider-row">
        <span class="demo-slider-label">Max particles</span>
        <input type="range" id="slider-count" min="10" max="400" step="10" value="150"
               oninput="updateCount(this.value)">
        <span class="demo-slider-val" id="val-count">150</span>
      </div>

      <div class="demo-slider-row">
        <span class="demo-slider-label">Speed</span>
        <input type="range" id="slider-speed" min="1" max="10" step="0.5" value="2"
               oninput="updateSpeed(this.value)">
        <span class="demo-slider-val" id="val-speed">2</span>
      </div>
    </div>

    <!-- Source note -->
    <div class="demo-source">
      // originally built for a friend's movie challenge list site —
      <a href="confetti.js" target="_blank">view source</a>
    </div>

  </div>

  <button class="fc-back-top" id="back-top" aria-label="Back to top">^ top</button>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/site.js"></script>
  <script src="confetti.js"></script>
  <script>
    let running = false;

    function setStatus(val) {
      document.getElementById('status-val').textContent = val;
      document.querySelector('#stage .btn-fc').textContent =
        running ? 'Stop confetti' : 'Start confetti';
    }

    function handleStart() {
      startConfetti();
      running = true;
      setStatus('running');
    }

    function handleStop() {
      stopConfetti();
      running = false;
      setStatus('stopped');
    }

    function handleRemove() {
      removeConfetti();
      running = false;
      setStatus('cleared');
    }

    function handleToggle() {
      toggleConfetti();
      running = !running;
      setStatus(running ? 'running' : 'stopped');
    }

    function updateCount(val) {
      document.getElementById('val-count').textContent = val;
      /* Rebuild with new count if currently running */
      Confetti.setMaxParticles(parseInt(val, 10));
    }

    function updateSpeed(val) {
      document.getElementById('val-speed').textContent = val;
      Confetti.setSpeed(parseFloat(val));
    }
  </script>
</body>
</html>
