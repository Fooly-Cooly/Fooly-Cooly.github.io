<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Photography gallery — Fooly-Cooly">
  <title>Gallery — Fooly-Cooly</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/theme.css">
  <style>
    /* ── Filter bar ── */
    .fc-filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 28px;
      position: sticky;
      top: 0;
      z-index: 40;
      background: var(--fc-bg);
      padding: 12px 0;
      margin-top: -12px;
      border-bottom: 1px solid var(--fc-green-border);
    }

    .fc-filter-btn {
      font-family: var(--fc-font-mono);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 5px 14px;
      border-radius: var(--fc-radius-sm);
      border: 1px solid var(--fc-green-border);
      background: transparent;
      color: var(--fc-text-muted);
      cursor: pointer;
      transition:
        color         var(--fc-transition),
        border-color  var(--fc-transition),
        background    var(--fc-transition);
    }

    .fc-filter-btn:hover {
      color: var(--fc-text);
      border-color: var(--fc-green-border-hover);
    }

    .fc-filter-btn.active {
      color: var(--fc-green);
      border-color: var(--fc-green-dim);
      background: var(--fc-green-glow);
    }

    /* ── Masonry grid (CSS columns) ── */
    .fc-masonry {
      columns: 3;
      column-gap: 12px;
    }

    @media (max-width: 768px) { .fc-masonry { columns: 2; } }
    @media (max-width: 480px) { .fc-masonry { columns: 1; } }

    .fc-masonry-item {
      break-inside: avoid;
      margin-bottom: 12px;
      display: block;
    }

    /* Hidden items during filter */
    .fc-masonry-item.hidden {
      display: none;
    }

    /* ── Gallery cards ── */
    .fc-gallery-card {
      cursor: pointer;
      border-radius: var(--fc-radius-md);
      overflow: hidden;
      border: 1px solid var(--fc-green-border);
      background: var(--fc-surface-2);
      transition:
        border-color  var(--fc-transition),
        transform     var(--fc-transition);
      display: block;
      width: 100%;
    }

    .fc-gallery-card:hover {
      border-color: var(--fc-green-dim);
      transform: translateY(-2px);
    }

    .fc-gallery-card img {
      width: 100%;
      height: auto;
      display: block;
      filter: saturate(0.85);
      transition: filter var(--fc-transition);
    }

    .fc-gallery-card:hover img {
      filter: saturate(1);
    }

    .fc-gallery-card-info {
      padding: 10px 12px 12px;
    }

    .fc-gallery-card-cat {
      font-family: var(--fc-font-mono);
      font-size: 0.68rem;
      color: var(--fc-green-dim);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 3px;
    }

    .fc-gallery-card-title {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--fc-text);
      margin-bottom: 2px;
    }

    .fc-gallery-card-desc {
      font-size: 0.75rem;
      color: var(--fc-text-muted);
      font-family: var(--fc-font-mono);
    }

    /* ── Empty state ── */
    .fc-gallery-empty {
      display: none;
      padding: 48px 0;
      font-family: var(--fc-font-mono);
      font-size: 0.82rem;
      color: var(--fc-text-muted);
    }

    /* ── Loading state ── */
    .fc-gallery-loading {
      padding: 48px 0;
      font-family: var(--fc-font-mono);
      font-size: 0.82rem;
      color: var(--fc-text-muted);
    }

    /* ── Lightbox ── */
    .fc-lightbox {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(5, 7, 6, 0.92);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease;
    }

    .fc-lightbox.open {
      opacity: 1;
      pointer-events: all;
    }

    .fc-lightbox-inner {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: min(90vw, 1100px);
      max-height: 90vh;
    }

    .fc-lightbox img {
      max-width: 100%;
      max-height: calc(90vh - 80px);
      object-fit: contain;
      border-radius: var(--fc-radius-md);
      border: 1px solid var(--fc-green-border);
      display: block;
      opacity: 1;
      transition: opacity 0.18s ease;
    }

    .fc-lightbox-caption {
      margin-top: 14px;
      text-align: center;
      width: 100%;
    }

    .fc-lightbox-caption-title {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--fc-text);
      margin-bottom: 2px;
    }

    .fc-lightbox-caption-desc {
      font-family: var(--fc-font-mono);
      font-size: 0.75rem;
      color: var(--fc-text-muted);
    }

    /* Prev / next / close controls */
    .fc-lightbox-close {
      position: fixed;
      top: 20px;
      right: 24px;
      background: none;
      border: 1px solid var(--fc-green-border);
      border-radius: var(--fc-radius-sm);
      color: var(--fc-text-muted);
      font-family: var(--fc-font-mono);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      padding: 4px 10px;
      cursor: pointer;
      transition: color var(--fc-transition), border-color var(--fc-transition);
    }

    .fc-lightbox-close:hover {
      color: var(--fc-green);
      border-color: var(--fc-green-dim);
    }

    .fc-lightbox-prev,
    .fc-lightbox-next {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: 1px solid var(--fc-green-border);
      border-radius: var(--fc-radius-sm);
      color: var(--fc-text-muted);
      font-family: var(--fc-font-mono);
      font-size: 1rem;
      padding: 10px 14px;
      cursor: pointer;
      transition: color var(--fc-transition), border-color var(--fc-transition);
    }

    .fc-lightbox-prev { left: 16px; }
    .fc-lightbox-next { right: 16px; }

    .fc-lightbox-prev:hover,
    .fc-lightbox-next:hover {
      color: var(--fc-green);
      border-color: var(--fc-green-dim);
    }

    .fc-lightbox-prev:disabled,
    .fc-lightbox-next:disabled {
      opacity: 0.2;
      cursor: default;
    }

    /* Counter */
    .fc-lightbox-counter {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      font-family: var(--fc-font-mono);
      font-size: 0.72rem;
      color: var(--fc-text-muted);
      letter-spacing: 0.1em;
    }

    @media (max-width: 576px) {
      .fc-lightbox-prev,
      .fc-lightbox-next {
        top: auto;
        bottom: 16px;
        transform: none;
      }
      .fc-lightbox-prev { left: 16px; }
      .fc-lightbox-next { right: 16px; }
    }
  </style>
</head>
<body>

  <div class="fc-container">

    <!-- Back nav -->
    <a href="../index.html" class="fc-nav-back">Back to home</a>

    <!-- Header -->
    <header style="padding: 28px 0 24px;">
      <div class="fc-page-title">Gallery</div>
      <div class="fc-page-subtitle" id="gallery-subtitle">Loading<span class="fc-cursor"></span></div>
      <hr class="fc-rule" style="margin-top: 20px;">
    </header>

    <!-- Filter bar — populated by JS -->
    <div class="fc-filter-bar" id="filter-bar" style="display:none;"></div>

    <!-- Gallery grid -->
    <div id="gallery-loading" class="fc-gallery-loading">
      // loading images<span class="fc-cursor"></span>
    </div>

    <div class="fc-masonry" id="gallery-grid" style="padding-bottom: 64px;"></div>

    <div class="fc-gallery-empty" id="gallery-empty">
      // no images in this category yet
    </div>

  </div><!-- /.fc-container -->

  <!-- Lightbox (outside container so it covers full viewport) -->
  <div class="fc-lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer">
    <button class="fc-lightbox-close" id="lb-close" aria-label="Close">esc / close</button>
    <span class="fc-lightbox-counter" id="lb-counter"></span>
    <button class="fc-lightbox-prev" id="lb-prev" aria-label="Previous image">&#8592;</button>
    <button class="fc-lightbox-next" id="lb-next" aria-label="Next image">&#8594;</button>
    <div class="fc-lightbox-inner">
      <img id="lb-img" src="" alt="">
      <div class="fc-lightbox-caption">
        <div class="fc-lightbox-caption-title" id="lb-title"></div>
        <div class="fc-lightbox-caption-desc"  id="lb-desc"></div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div class="fc-container">
    <footer class="fc-footer">
      fooly-cooly.github.io<span class="fc-cursor"></span>
    </footer>
  </div>

  <button class="fc-back-top" id="back-top" aria-label="Back to top">^ top</button>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/site.js"></script>
  <script>
    /* ═══════════════════════════════════════════════
       State
    ═══════════════════════════════════════════════ */
    let allImages    = [];   /* full manifest array */
    let filteredIdxs = [];   /* indices into allImages currently visible */
    let lbIndex      = 0;    /* current lightbox position in filteredIdxs */
    let activeFilter = 'all';

    /* ═══════════════════════════════════════════════
       Load manifest
    ═══════════════════════════════════════════════ */
    async function loadGallery() {
      try {
        const res = await fetch('gallery.json');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        allImages = await res.json();
      } catch (err) {
        document.getElementById('gallery-loading').innerHTML =
          `// failed to load gallery manifest: ${err.message}`;
        return;
      }

      document.getElementById('gallery-loading').style.display = 'none';

      if (!allImages.length) {
        document.getElementById('gallery-subtitle').textContent = '0 photos';
        document.getElementById('gallery-empty').style.display = 'block';
        return;
      }

      buildFilterBar();
      buildGrid('all');
      updateSubtitle();
    }

    /* ═══════════════════════════════════════════════
       Filter bar
    ═══════════════════════════════════════════════ */
    function buildFilterBar() {
      /* Collect unique categories, preserving first-seen order */
      const seen = new Set();
      const cats = [];
      allImages.forEach(img => {
        const c = (img.category || 'Uncategorised').trim();
        if (!seen.has(c)) { seen.add(c); cats.push(c); }
      });

      /* Only show the bar if there are multiple categories */
      if (cats.length < 2) return;

      const bar = document.getElementById('filter-bar');
      bar.style.display = 'flex';

      /* Build button HTML string, inject in one pass */
      const html = ['all', ...cats].map(cat => {
        const active = cat === 'all' ? ' active' : '';
        const label  = cat === 'all' ? 'All' : cat;
        return `<button class="fc-filter-btn${active}" data-cat="${cat}">${label}</button>`;
      }).join('');

      bar.innerHTML = html;

      /* Attach listeners after injection */
      bar.querySelectorAll('.fc-filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const cat = btn.dataset.cat;
          if (cat === activeFilter) return;
          activeFilter = cat;
          bar.querySelectorAll('.fc-filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          buildGrid(cat);
          updateSubtitle();
        });
      });
    }

    /* ═══════════════════════════════════════════════
       Grid
    ═══════════════════════════════════════════════ */
    function buildGrid(filter) {
      /* Compute which indices are visible */
      filteredIdxs = allImages.reduce((acc, img, i) => {
        const cat = (img.category || 'Uncategorised').trim();
        if (filter === 'all' || cat === filter) acc.push(i);
        return acc;
      }, []);

      const empty = document.getElementById('gallery-empty');
      const grid  = document.getElementById('gallery-grid');

      if (!filteredIdxs.length) {
        grid.innerHTML = '';
        empty.style.display = 'block';
        return;
      }

      empty.style.display = 'none';

      /* Build all card HTML as one string — single innerHTML, single parse.
         Grid cards always use the thumbnail; lightbox loads full-res. */
      const html = filteredIdxs.map((globalIdx, pos) => {
        const img   = allImages[globalIdx];
        const thumb = `img/thumbs/${img.file}`;
        const cat   = img.category    || '';
        const ttl   = img.title       || img.file;
        const dsc   = img.description || '';

        return `
          <div class="fc-masonry-item" data-pos="${pos}">
            <div class="fc-gallery-card" role="button" tabindex="0"
                 aria-label="View ${ttl}"
                 data-pos="${pos}">
              <img src="${thumb}"
                   alt="${ttl}"
                   loading="lazy"
                   decoding="async">
              <div class="fc-gallery-card-info">
                ${cat ? `<div class="fc-gallery-card-cat">${cat}</div>` : ''}
                <div class="fc-gallery-card-title">${ttl}</div>
                ${dsc ? `<div class="fc-gallery-card-desc">${dsc}</div>` : ''}
              </div>
            </div>
          </div>`;
      }).join('');

      grid.innerHTML = html;

      /* Attach open-lightbox listeners — no DOM mutations, just events */
      grid.querySelectorAll('.fc-gallery-card').forEach(card => {
        const openLightbox = () => openAt(parseInt(card.dataset.pos, 10));
        card.addEventListener('click', openLightbox);
        card.addEventListener('keydown', e => {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openLightbox(); }
        });
      });
    }

    /* ═══════════════════════════════════════════════
       Subtitle
    ═══════════════════════════════════════════════ */
    function updateSubtitle() {
      const total = allImages.length;
      const shown = filteredIdxs.length;
      const sub   = document.getElementById('gallery-subtitle');
      sub.textContent = activeFilter === 'all'
        ? `${total} photo${total !== 1 ? 's' : ''}`
        : `${shown} of ${total} — ${activeFilter}`;
    }

    /* ═══════════════════════════════════════════════
       Lightbox
    ═══════════════════════════════════════════════ */
    const lightbox = document.getElementById('lightbox');
    const lbImg    = document.getElementById('lb-img');
    const lbTitle  = document.getElementById('lb-title');
    const lbDesc   = document.getElementById('lb-desc');
    const lbPrev   = document.getElementById('lb-prev');
    const lbNext   = document.getElementById('lb-next');
    const lbCount  = document.getElementById('lb-counter');

    /* Preload cache — keyed by full-res src to avoid double-fetching */
    const preloadCache = new Set();

    function preloadAdjacent(pos) {
      /* Quietly fetch the prev and next full-res images into browser cache */
      [-1, 1].forEach(delta => {
        const adjPos = pos + delta;
        if (adjPos < 0 || adjPos >= filteredIdxs.length) return;
        const src = `img/${allImages[filteredIdxs[adjPos]].file}`;
        if (preloadCache.has(src)) return;
        preloadCache.add(src);
        const preloader = new Image();
        preloader.src = src;
      });
    }

    function openAt(pos) {
      lbIndex = pos;
      renderLightbox();
      lightbox.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      lightbox.classList.remove('open');
      document.body.style.overflow = '';
      /* Fade back in for next open — reset opacity in case it was mid-load */
      lbImg.style.opacity = '1';
    }

    function renderLightbox() {
      const globalIdx = filteredIdxs[lbIndex];
      const img       = allImages[globalIdx];
      const fullSrc   = `img/${img.file}`;

      /* Update caption and controls immediately — no waiting on the image */
      lbTitle.textContent = img.title       || '';
      lbDesc.textContent  = img.description || '';
      lbCount.textContent = `${lbIndex + 1} / ${filteredIdxs.length}`;
      lbImg.alt           = img.title || img.file;

      lbPrev.disabled = lbIndex === 0;
      lbNext.disabled = lbIndex === filteredIdxs.length - 1;

      /* Fade out, swap src, fade back in once loaded */
      lbImg.style.opacity = '0';

      const onLoad = () => {
        lbImg.style.opacity = '1';
        lbImg.removeEventListener('load', onLoad);
        preloadAdjacent(lbIndex);
      };

      lbImg.addEventListener('load', onLoad);

      /* If already cached the load event may fire synchronously before
         the listener is attached — handle that with a readiness check */
      if (lbImg.complete && lbImg.naturalWidth > 0) {
        lbImg.style.opacity = '1';
        lbImg.removeEventListener('load', onLoad);
        preloadAdjacent(lbIndex);
      }

      lbImg.src = fullSrc;
    }

    function stepLightbox(delta) {
      const next = lbIndex + delta;
      if (next < 0 || next >= filteredIdxs.length) return;
      lbIndex = next;
      renderLightbox();
    }

    /* Controls */
    document.getElementById('lb-close').addEventListener('click', closeLightbox);
    lbPrev.addEventListener('click', () => stepLightbox(-1));
    lbNext.addEventListener('click', () => stepLightbox(+1));

    /* Click backdrop to close */
    lightbox.addEventListener('click', e => {
      if (e.target === lightbox) closeLightbox();
    });

    /* Keyboard navigation */
    document.addEventListener('keydown', e => {
      if (!lightbox.classList.contains('open')) return;
      if (e.key === 'Escape')     closeLightbox();
      if (e.key === 'ArrowLeft')  stepLightbox(-1);
      if (e.key === 'ArrowRight') stepLightbox(+1);
    });

    /* ═══════════════════════════════════════════════
       Init
    ═══════════════════════════════════════════════ */
    loadGallery();
  </script>
</body>
</html>
